[package]
name = "wayland"
version = "0.1.0"
edition = "2024"

[dependencies]
app.workspace = true
bitflags.workspace = true
ring.workspace = true

[build-dependencies]
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"

[features]
## A scripted compositor over a socketpair, for tests.
fake = []

[dev-dependencies]
wayland = { path = ".", features = ["fake"] }
