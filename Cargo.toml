# The `mecha-wayland` facade crate and workspace root. Crates are added to
# `members` as they are rewritten against the new `app` core.
[package]
name = "mecha-wayland"
version = "0.1.0"
edition = "2024"

[dependencies]
app.workspace = true
atlas = { workspace = true, features = ["svg"] }
geometry.workspace = true
layout.workspace = true
paint.workspace = true
render.workspace = true
window.workspace = true

[workspace]
members = ["crates/app", "crates/atlas", "crates/geometry", "crates/layout", "crates/paint", "crates/render", "crates/window"]
resolver = "3"

[workspace.dependencies]
app = { path = "crates/app" }
atlas = { path = "crates/atlas" }
geometry = { path = "crates/geometry" }
layout = { path = "crates/layout" }
paint = { path = "crates/paint" }
render = { path = "crates/render" }
window = { path = "crates/window" }
fontdue = "0.9"
png = "0.18"
resvg = { version = "0.44", default-features = false }
smallvec = "1"
taffy = { version = "0.10.1", default-features = false, features = ["std", "flexbox", "block_layout"] }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
