# The `mecha-wayland` facade crate and workspace root. Crates are added to
# `members` as they are rewritten against the new `app` core.
[package]
name = "mecha-wayland"
version = "0.1.0"
edition = "2024"

[dependencies]
app.workspace = true
geometry.workspace = true
layout.workspace = true
paint.workspace = true
render.workspace = true
ring.workspace = true
window.workspace = true

[workspace]
members = ["crates/app", "crates/geometry", "crates/layout", "crates/paint", "crates/render", "crates/ring", "crates/wayland", "crates/window"]
resolver = "3"

[workspace.dependencies]
app = { path = "crates/app" }
geometry = { path = "crates/geometry" }
layout = { path = "crates/layout" }
paint = { path = "crates/paint" }
render = { path = "crates/render" }
ring = { path = "crates/ring" }
window = { path = "crates/window" }
bitflags = "2"
io-uring = "0.7"
libc = "0.2"
smallvec = "1"
taffy = { version = "0.10.1", default-features = false, features = ["std", "flexbox", "block_layout"] }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
