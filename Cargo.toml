# The `mecha-wayland` facade crate and workspace root. Crates are added to
# `members` as they are rewritten against the new `app` core.
[package]
name = "mecha-wayland"
version = "0.1.0"
edition = "2024"

[dependencies]

[workspace]
members = []
resolver = "3"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
